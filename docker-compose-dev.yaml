networks:
  monitoring_network:
    driver: bridge

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-local
    restart: unless-stopped
    network_mode: host
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.75
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./web.yml:/etc/prometheus/web.yml:ro
      - ./docker-volume/metrics/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--storage.tsdb.wal-compression"
      - "--web.config.file=/etc/prometheus/web.yml"
      - "--web.listen-address=${IP_HOST}:${PROMETHEUS_PORT}"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.2
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--web.listen-address=${IP_HOST}:${NODE_EXPORTER_PORT}"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.5
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    network_mode: host
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1.0
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    command:
      - "--port=${CADVISOR_PORT}"
      - "--listen_ip=${IP_HOST}"
      - "--disable_metrics=advtcp,cpuLoad,cpu_topology,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp"
      - "--docker_only=true"
      - "--housekeeping_interval=120s"
      - "--max_housekeeping_interval=300s"
      - "--allow_dynamic_housekeeping=true"
